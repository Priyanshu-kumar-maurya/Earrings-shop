<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Elegant Earrings Shop</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div class="auth-container">
        <div class="auth-box" id="authBox">
            <div class="auth-header">
                <h2>Welcome Back</h2>
                <p>Login to your account</p>
            </div>
            <!-- Success message will be shown here after login -->
            <div class="login-success" style="display: none">
                <div class="success-icon">
                    <i class="fas fa-check-circle"></i>
                </div>
                <h2>Login Successful!</h2>
                <p class="welcome-message">Welcome back!</p>
                <a href="index.html" class="shopping-button">
                    <i class="fas fa-shopping-bag"></i>
                    Go to Shopping
                </a>
            </div>
            <form id="loginForm" class="auth-form">
                <div class="form-group">
                    <i class="fas fa-envelope"></i>
                    <input type="email" id="email" placeholder="Email Address" required>
                </div>
                <div class="form-group">
                    <i class="fas fa-lock"></i>
                    <input type="password" id="password" placeholder="Password" required>
                </div>
                <div class="form-group remember-forgot">
                    <label>
                        <input type="checkbox" id="remember"> Remember me
                    </label>
                    <a href="#" class="forgot-password">Forgot Password?</a>
                </div>
                <button type="submit" class="auth-button">Login</button>
            </form>
            <div class="auth-divider">
                <span>OR</span>
            </div>
            <button class="social-button google">
                <i class="fab fa-google"></i> Continue with Google
            </button>
            <p class="auth-footer">
                Don't have an account? <a href="#" id="showRegister">Sign Up</a>
            </p>
        </div>

        <!-- Registration Form (Initially Hidden) -->
        <div class="auth-box register-box" style="display: none;">
            <div class="auth-header">
                <h2>Create Account</h2>
                <p>Join our community</p>
            </div>
            <form id="registerForm" class="auth-form">
                <div class="form-group">
                    <i class="fas fa-user"></i>
                    <input type="text" id="fullName" placeholder="Full Name" required>
                </div>
                <div class="form-group">
                    <i class="fas fa-envelope"></i>
                    <input type="email" id="regEmail" placeholder="Email Address" required>
                </div>
                <div class="form-group">
                    <i class="fas fa-phone"></i>
                    <input type="tel" id="phone" placeholder="Phone Number" required>
                </div>
                <div class="form-group">
                    <i class="fas fa-lock"></i>
                    <input type="password" id="regPassword" placeholder="Password" required>
                </div>
                <div class="form-group">
                    <i class="fas fa-lock"></i>
                    <input type="password" id="confirmPassword" placeholder="Confirm Password" required>
                </div>
                <button type="submit" class="auth-button">Sign Up</button>
            </form>
            <p class="auth-footer">
                Already have an account? <a href="#" id="showLogin">Login</a>
            </p>
        </div>
    </div>

    <script src="auth.js"></script>
</body>
</html>
